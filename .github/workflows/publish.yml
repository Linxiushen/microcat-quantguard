name: Validate and publish QuantGuard
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quantguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify unit contracts
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_house.py tests/test_task.py tests/test_validation.py
      - name: Build native Linux amd64 image
        run: |
          docker build --platform linux/amd64 --target release \
            --label org.opencontainers.image.source=https://github.com/Linxiushen/microcat-quantguard \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ghcr.io/linxiushen/microcat-quantguard:${{ github.sha }} .
      - name: Run container validation before publication
        run: |
          python tools/container_smoke.py \
            --image ghcr.io/linxiushen/microcat-quantguard:${{ github.sha }} \
            --report reports/ci-container-smoke.json
      - name: Publish validated container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/linxiushen/microcat-quantguard:${{ github.sha }}
          docker buildx imagetools inspect ghcr.io/linxiushen/microcat-quantguard:${{ github.sha }}
